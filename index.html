<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de Produtos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5d6675;--ac:#16a34a;--acx:#fff;--bd:#dfe3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#22c55e;--acx:#06210f;--bd:#2a323d}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#22c55e;--acx:#06210f;--bd:#2a323d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}
canvas#view{width:100%;height:auto;display:block}
.ph{position:absolute;color:#9aa4b2;font-size:14px;text-align:center;padding:16px}
.count{display:flex;align-items:baseline;gap:8px;margin:12px 2px 4px}
.count b{font-size:56px;line-height:1;color:var(--ac)}
.count span{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn{flex:1;min-width:130px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:center;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:transparent}
button.p.r{background:#dc2626;color:#fff}
button:disabled{opacity:.45}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
input[type=range]{width:100%}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.msg{color:var(--mut);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<h1>📦 Contador de Produtos</h1>

<div class="card">
  <div class="stage">
    <canvas id="view" width="640" height="360"></canvas>
    <div class="ph" id="ph">Toque em “Abrir câmera” ou escolha uma foto</div>
  </div>
  <div class="count"><b id="n">0</b><span id="lbl">produtos</span></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div class="row">
    <button class="p" id="bStart">Abrir câmera</button>
    <button id="bShot" disabled>📸 Tirar foto</button>
    <button id="bLive" disabled>Voltar ao vivo</button>
    <label class="btn">🖼️ Enviar foto<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
</div>

<div class="card">
  <label class="chk"><input type="checkbox" id="inv" checked> Produtos mais escuros que o fundo</label>
  <div class="ctl"><label><span>Tamanho mínimo do produto</span><span id="vA"></span></label>
    <input type="range" id="area" min="0.05" max="5" step="0.05" value="0.3"></div>
  <div class="ctl"><label><span>Sensibilidade</span><span id="vT"></span></label>
    <input type="range" id="off" min="-50" max="50" step="1" value="0"></div>
  <div class="msg">Dica: fundo liso e bem iluminado, com os produtos separados, dá a melhor contagem. Ajuste os controles até o número bater.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const view=$('view'),vctx=view.getContext('2d');
const work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
const video=document.createElement('video');video.playsInline=true;video.muted=true;
const still=document.createElement('canvas');
let stream=null,mode='idle',hist=[],timer=null;
const W=320;

function otsu(g){
  const h=new Array(256).fill(0);for(let i=0;i<g.length;i++)h[g[i]]++;
  const tot=g.length;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];
  let sb=0,wb=0,best=0,t=128;
  for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=tot-wb;if(!wf)break;
    sb+=i*h[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>best){best=v;t=i}}
  return t;
}

function analyze(src,sw,sh){
  const w=W,h=Math.max(2,Math.round(W*sh/sw));
  work.width=w;work.height=h;wctx.drawImage(src,0,0,w,h);
  const d=wctx.getImageData(0,0,w,h).data,n=w*h,g=new Uint8Array(n);
  for(let i=0;i<n;i++)g[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
  const b=new Uint8Array(g);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    b[i]=(g[i-w-1]+g[i-w]+g[i-w+1]+g[i-1]+g[i]+g[i+1]+g[i+w-1]+g[i+w]+g[i+w+1])/9}
  const t=Math.min(254,Math.max(1,otsu(b)+(+$('off').value)));
  const inv=$('inv').checked;
  let m=new Uint8Array(n);
  for(let i=0;i<n;i++)m[i]=(inv?b[i]<=t:b[i]>t)?1:0;
  // abertura 3x3 (erode + dilate)
  const e=new Uint8Array(n);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    e[i]=m[i]&&m[i-1]&&m[i+1]&&m[i-w]&&m[i+w]&&m[i-w-1]&&m[i-w+1]&&m[i+w-1]&&m[i+w+1]?1:0}
  const o=new Uint8Array(n);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    o[i]=e[i]||e[i-1]||e[i+1]||e[i-w]||e[i+w]||e[i-w-1]||e[i-w+1]||e[i+w-1]||e[i+w+1]?1:0}
  // componentes conectados
  const minA=n*(+$('area').value)/100,maxA=n*0.6;
  const seen=new Uint8Array(n),st=new Int32Array(n),boxes=[];
  for(let s=0;s<n;s++){
    if(!o[s]||seen[s])continue;
    let sp=0,a=0,x0=w,y0=h,x1=0,y1=0;st[sp++]=s;seen[s]=1;
    while(sp){const i=st[--sp],x=i%w,y=(i/w)|0;a++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&o[i-1]&&!seen[i-1]){seen[i-1]=1;st[sp++]=i-1}
      if(x<w-1&&o[i+1]&&!seen[i+1]){seen[i+1]=1;st[sp++]=i+1}
      if(y>0&&o[i-w]&&!seen[i-w]){seen[i-w]=1;st[sp++]=i-w}
      if(y<h-1&&o[i+w]&&!seen[i+w]){seen[i+w]=1;st[sp++]=i+w}}
    if(a>=minA&&a<=maxA)boxes.push({x:x0,y:y0,w:x1-x0+1,h:y1-y0+1});
  }
  return{boxes,w};
}

function run(src,sw,sh,smooth){
  const{boxes,w}=analyze(src,sw,sh);
  view.width=sw;view.height=sh;vctx.drawImage(src,0,0,sw,sh);
  const k=sw/w;vctx.lineWidth=Math.max(2,sw/260);vctx.strokeStyle='#22c55e';
  vctx.font='bold '+Math.max(14,sw/32)+'px system-ui';vctx.fillStyle='#22c55e';
  boxes.forEach((b,i)=>{vctx.strokeRect(b.x*k,b.y*k,b.w*k,b.h*k);vctx.fillText(i+1,b.x*k+3,b.y*k+Math.max(14,sw/32))});
  let c=boxes.length;
  if(smooth){hist.push(c);if(hist.length>5)hist.shift();c=[...hist].sort((a,b)=>a-b)[hist.length>>1]}
  $('n').textContent=c;$('lbl').textContent=c===1?'produto':'produtos';
  $('ph').style.display='none';
}

function loop(){
  if(mode!=='live')return;
  if(video.readyState>=2&&video.videoWidth)run(video,video.videoWidth,video.videoHeight,true);
  timer=setTimeout(()=>requestAnimationFrame(loop),120);
}

async function start(){
  $('msg').textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('msg').textContent='Câmera ao vivo indisponível aqui (precisa de HTTPS). Use “Enviar foto”.';return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    video.srcObject=stream;await video.play();
    mode='live';hist=[];$('bShot').disabled=false;$('bLive').disabled=true;$('bStart').textContent='Desligar câmera';$('bStart').classList.add('r');loop();
  }catch(err){
    $('msg').textContent='Não consegui abrir a câmera ('+(err.name||'erro')+'). Use “Enviar foto” para tirar pela câmera do celular.';
  }
}

function shot(){
  if(mode!=='live')return;
  clearTimeout(timer);
  still.width=video.videoWidth;still.height=video.videoHeight;
  still.getContext('2d').drawImage(video,0,0);
  mode='photo';$('bLive').disabled=false;run(still,still.width,still.height,false);
}

function back(){if(!stream)return;mode='live';hist=[];$('bLive').disabled=true;loop()}

function stop(){
  clearTimeout(timer);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('bStart').textContent='Abrir câmera';$('bStart').classList.remove('r');
  $('bShot').disabled=true;$('bLive').disabled=true;
  if(mode==='live'){mode='idle';hist=[];vctx.clearRect(0,0,view.width,view.height);$('n').textContent='0';$('lbl').textContent='produtos';$('ph').style.display='block'}
}
$('bStart').onclick=()=>stream?stop():start();
$('bShot').onclick=shot;
$('bLive').onclick=back;
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  clearTimeout(timer);
  const img=new Image();
  img.onload=()=>{const s=Math.min(1,1280/img.width);
    still.width=img.width*s;still.height=img.height*s;
    still.getContext('2d').drawImage(img,0,0,still.width,still.height);
    mode='photo';$('bLive').disabled=!stream;run(still,still.width,still.height,false);URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(f);e.target.value='';
};

function sync(){
  $('vA').textContent=$('area').value+'%';
  $('vT').textContent=($('off').value>0?'+':'')+$('off').value;
  if(mode==='photo')run(still,still.width,still.height,false);
}
['area','off','inv'].forEach(id=>$(id).addEventListener('input',sync));
sync();
</script>
</body>
</html>
