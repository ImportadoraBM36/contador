<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de Produtos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5d6675;--ac:#16a34a;--acx:#fff;--bd:#dfe3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#22c55e;--acx:#06210f;--bd:#2a323d}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#22c55e;--acx:#06210f;--bd:#2a323d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}
canvas#view{width:100%;height:auto;display:block}
.ph{position:absolute;color:#9aa4b2;font-size:14px;text-align:center;padding:16px}
.count{display:flex;align-items:baseline;gap:8px;margin:12px 2px 4px}
.count b{font-size:56px;line-height:1;color:var(--ac)}
.count span{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn{flex:1;min-width:130px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:center;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:transparent}
button.p.r{background:#dc2626;color:#fff}
button:disabled{opacity:.45}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:4px}
input[type=range]{width:100%}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.msg{color:var(--mut);font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<h1>📦 Contador de Produtos</h1>

<div class="card">
  <div class="stage">
    <canvas id="view" width="640" height="360"></canvas>
    <div class="ph" id="ph">Toque em “Abrir câmera” ou escolha uma foto</div>
  </div>
  <div class="count"><b id="n">0</b><span id="lbl">produtos</span></div>
  <div class="msg" id="dets"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div class="row">
    <button class="p" id="bStart">Abrir câmera</button>
    <button id="bShot" disabled>📸 Tirar foto</button>
    <button id="bLive" disabled>Voltar ao vivo</button>
    <label class="btn">🖼️ Enviar foto<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
</div>

<div class="card">
  <div class="ctl"><label for="cls"><span>O que contar</span></label>
    <select id="cls"><option value="all">Tudo (menos pessoas)</option></select></div>
  <div class="ctl"><label><span>Confiança mínima da IA</span><span id="vC"></span></label>
    <input type="range" id="conf" min="10" max="90" step="5" value="40"></div>
  <div class="msg">Abaixo da contagem aparece o nome que a IA deu para cada coisa que ela vê. Escolha em “O que contar” o nome que corresponde ao seu produto. Se a IA contar coisas a mais, aumente a confiança; se faltar produto, diminua.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const view=$('view'),vctx=view.getContext('2d');
const video=document.createElement('video');video.playsInline=true;video.muted=true;
const still=document.createElement('canvas');
let model=null,stream=null,mode='idle',hist=[],timer=null,busy=false,last=null,tracks=[];
const known=new Set();
const msg=t=>$('msg').textContent=t;

async function loadModel(){
  if(model)return true;
  if(!window.cocoSsd||!window.tf){msg('Não consegui carregar a IA. Confira a internet e se a página está em HTTPS.');return false}
  msg('Carregando a IA (só na primeira vez, pode levar alguns segundos)...');
  try{await tf.ready();model=await cocoSsd.load({base:'lite_mobilenet_v2'});msg('');return true}
  catch(e){msg('Falha ao carregar a IA: '+(e.message||e));return false}
}

async function detect(src,sw,sh,smooth){
  if(busy||!model)return;
  busy=true;
  try{
    const p=await model.detect(src,40,0.05);
    last={src,sw,sh,p};
    if(smooth)track(p);
    render(smooth);
  }catch(e){msg('Erro na detecção: '+(e.message||e))}
  finally{busy=false}
}

const MAXMISS=10;
function iou(a,b){const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/(a[2]*a[3]+b[2]*b[3]-i||1)}
function track(p){
  const minS=(+$('conf').value)/100,pairs=[];
  tracks.forEach((t,ti)=>p.forEach((d,di)=>{if(d.class===t.cls){const v=iou(t.bbox,d.bbox);if(v>0.3)pairs.push([v,ti,di])}}));
  pairs.sort((a,b)=>b[0]-a[0]);
  const ut=new Set(),ud=new Set();
  pairs.forEach(([v,ti,di])=>{if(ut.has(ti)||ud.has(di))return;ut.add(ti);ud.add(di);
    const t=tracks[ti],d=p[di];
    t.bbox=t.bbox.map((q,k)=>q*0.5+d.bbox[k]*0.5);t.score=t.score*0.6+d.score*0.4;t.miss=0;t.hits++});
  tracks.forEach((t,i)=>{if(!ut.has(i))t.miss++});
  p.forEach((d,di)=>{if(!ud.has(di)&&d.score>=minS)tracks.push({cls:d.class,bbox:d.bbox.slice(),score:d.score,miss:0,hits:1})});
  tracks=tracks.filter(t=>t.miss<=MAXMISS);
}

function render(smooth){
  if(!last||mode==='idle')return;
  const{src,sw,sh,p}=last;
  const minS=(+$('conf').value)/100;
  p.forEach(d=>{if(!known.has(d.class)){known.add(d.class);const o=document.createElement('option');o.value=d.class;o.textContent=d.class;$('cls').appendChild(o)}});
  const sel=$('cls').value;
  const ok=smooth?tracks.filter(t=>t.hits>=2&&t.score>=minS*0.6).map(t=>({class:t.cls,bbox:t.bbox,score:t.score})):p.filter(d=>d.score>=minS);
  const mine=ok.filter(d=>sel==='all'?d.class!=='person':d.class===sel);
  view.width=sw;view.height=sh;vctx.drawImage(src,0,0,sw,sh);
  const fs=Math.max(14,sw/36);vctx.font='bold '+fs+'px system-ui';vctx.lineWidth=Math.max(2,sw/260);
  ok.forEach(d=>{
    const mark=mine.includes(d),[x,y,w,h]=d.bbox;
    vctx.strokeStyle=mark?'#22c55e':'#94a3b8';vctx.strokeRect(x,y,w,h);
    if(mark){const i=mine.indexOf(d)+1;vctx.fillStyle='#22c55e';vctx.fillText(i+' '+d.class+' '+Math.round(d.score*100)+'%',x+4,y+fs)}
  });
  const c=mine.length;
  $('n').textContent=c;$('lbl').textContent=c===1?'produto':'produtos';
  const cnt={};ok.forEach(d=>cnt[d.class]=(cnt[d.class]||0)+1);
  $('dets').textContent=ok.length?'A IA vê: '+Object.entries(cnt).map(([k,v])=>k+' ×'+v).join(' · '):'A IA não reconheceu nada por enquanto.';
  $('ph').style.display='none';
}

async function loop(){
  if(mode!=='live')return;
  if(video.readyState>=2&&video.videoWidth)await detect(video,video.videoWidth,video.videoHeight,true);
  if(mode==='live')timer=setTimeout(loop,30);
}

async function start(){
  msg('');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Câmera ao vivo indisponível aqui (precisa de HTTPS). Use “Enviar foto”.');return}
  $('bStart').disabled=true;
  const ready=await loadModel();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    video.srcObject=stream;await video.play();
    mode='live';hist=[];tracks=[];$('bShot').disabled=!ready;$('bLive').disabled=true;
    $('bStart').textContent='Desligar câmera';$('bStart').classList.add('r');
    if(ready)loop();
  }catch(err){msg('Não consegui abrir a câmera ('+(err.name||'erro')+'). Use “Enviar foto”.')}
  $('bStart').disabled=false;
}

function stop(){
  clearTimeout(timer);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('bStart').textContent='Abrir câmera';$('bStart').classList.remove('r');
  $('bShot').disabled=true;$('bLive').disabled=true;
  if(mode==='live'){mode='idle';hist=[];tracks=[];last=null;vctx.clearRect(0,0,view.width,view.height);
    $('n').textContent='0';$('lbl').textContent='produtos';$('dets').textContent='';$('ph').style.display='block'}
}

async function shot(){
  if(mode!=='live')return;
  clearTimeout(timer);
  still.width=video.videoWidth;still.height=video.videoHeight;
  still.getContext('2d').drawImage(video,0,0);
  mode='photo';$('bLive').disabled=false;
  while(busy)await new Promise(r=>setTimeout(r,30));
  await detect(still,still.width,still.height,false);
}

function back(){if(!stream)return;mode='live';hist=[];tracks=[];$('bLive').disabled=true;loop()}

$('bStart').onclick=()=>stream?stop():start();
$('bShot').onclick=shot;
$('bLive').onclick=back;
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  clearTimeout(timer);
  const ready=await loadModel();if(!ready)return;
  const img=new Image();
  img.onload=async()=>{const s=Math.min(1,1280/img.width);
    still.width=img.width*s;still.height=img.height*s;
    still.getContext('2d').drawImage(img,0,0,still.width,still.height);
    mode='photo';$('bLive').disabled=!stream;URL.revokeObjectURL(img.src);
    while(busy)await new Promise(r=>setTimeout(r,30));
    await detect(still,still.width,still.height,false)};
  img.src=URL.createObjectURL(f);e.target.value='';
};

function sync(){$('vC').textContent=$('conf').value+'%';if(mode==='photo')render(false)}
$('conf').addEventListener('input',sync);
$('cls').addEventListener('change',()=>{hist=[];if(mode==='photo')render(false)});
sync();
</script>
</body>
</html>
